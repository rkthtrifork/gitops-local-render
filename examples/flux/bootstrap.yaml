apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: example
  namespace: flux-system
spec:
  interval: 10m
  path: ${APP_PATH}
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ignored-by-target
          labels:
            app.kubernetes.io/managed-by: flux
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: example-vars
